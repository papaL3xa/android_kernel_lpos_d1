name: build and release

on:
  workflow_dispatch:
    inputs:      
      tag:
        description: 'Release Tag'
        required: true        

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write    

    steps:
      - name: Checkout source with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install packages & setup
        run: |
          sudo apt update -y  
          sudo apt install -y \
            build-essential \
            libncurses5-dev \
            libtinfo5 \
            python3 \
            python2 \
            git \
            wget \
            curl \
            tar \
            xz-utils \
            unzip \
            rsync \
            bc \
            libssl-dev \
            libelf-dev \
            flex \
            bison \
            sed

      - name: Initialize toolchain
        run: |
          chmod +x init_clang_13.sh
          bash init_clang_13.sh

      - name: Set environment variable
        run: |
          echo "LPOS_KERNEL_VERSION=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
      
      - name: Initialize and update submodules
        run: |
          git submodule init
          git submodule update --remote --depth=1
          ls -la drivers/kernelsu || echo "KernelSU not found, will be handled in build script"

      - name: Apply aggressive Kconfig fixes
        run: |
          # Create missing kperfmon directory and Kconfig
          mkdir -p drivers/kperfmon
          cat > drivers/kperfmon/Kconfig << 'EOF'
          # SPDX-License-Identifier: GPL-2.0
          config KPERFMON
          bool "Kernel Performance Monitor"
          default n
          help
          This is a stub for the missing kperfmon driver.
          EOF

          # Completely remove kperfmon reference from drivers/Kconfig
          sed -i '/kperfmon/d' drivers/Kconfig
          
          # Remove special characters from all Kconfig files
          find drivers/ -name "Kconfig" -exec sed -i 's/\r//g' {} \;
          find drivers/ -name "Kconfig" -exec sed -i '/^[[:space:]]*$/d' {} \;
          
          # Use tr to remove non-printable characters
          for kconfig in drivers/Kconfig drivers/leds/Kconfig drivers/redriver/Kconfig drivers/samsung/misc/Kconfig; do
            if [ -f "$kconfig" ]; then
              cp "$kconfig" "$kconfig.backup"
              tr -cd '\11\12\15\40-\176' < "$kconfig.backup" > "$kconfig"
              rm -f "$kconfig.backup"
            fi
          done

      - name: setting permission
        run: chmod +x build_kernel.sh

      - name: Building LPoS
        run: |
          export PATH=$PWD/toolchain/bin:$PATH
          bash build_kernel.sh -c

      - name: Building LPoS + KernelSU
        run: |
          export PATH=$PWD/toolchain/bin:$PATH
          bash build_kernel.sh -k

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "LPoS-${{ env.LPOS_KERNEL_VERSION }}-[Note10]"
          path: |
            out/LPoS*.zip
            out/KSU*.zip

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.tag }}
          name: "LPoS Kernel ${{ env.LPOS_KERNEL_VERSION }}"
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "out/LPoS*.zip,out/KSU*.zip"
          body: "Commit SHA: ${{ github.sha }}"