name: build and release

on:
  workflow_dispatch:
    inputs:      
      tag:
        description: 'Release Tag'
        required: true        

jobs:
  build:
    runs-on: ubuntu-22.04  # Use Ubuntu 22.04 for better compatibility
    permissions:
      contents: write    

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install packages & setup
        run: |
          sudo apt update -y  
          sudo apt install -y \
            build-essential \
            libncurses5-dev \
            libtinfo5 \
            python3 \
            python2 \
            git \
            wget \
            curl \
            tar \
            xz-utils \
            unzip \
            rsync \
            bc \
            libssl-dev \
            libelf-dev \
            flex \
            bison

      - name: Initialize toolchain
        run: |
          chmod +x init_clang_13.sh
          bash init_clang_13.sh

      - name: Set environment variable
        run: |
          echo "LPOS_KERNEL_VERSION=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
      
      - name: setting permission
        run: chmod +x build_kernel.sh

      - name: Building LPoS + KernelSU
        run: |
          export PATH=$PWD/toolchain/bin:$PATH
          bash build_kernel.sh -k
          
      - name: Building LPoS
        run: |
          export PATH=$PWD/toolchain/bin:$PATH
          bash build_kernel.sh -c

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "LPoS-${{ env.LPOS_KERNEL_VERSION }}-[Note10]"
          path: |
            out/LPoS*.zip
            out/KSU*.zip

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.tag }}
          name: "LPoS Kernel ${{ env.LPOS_KERNEL_VERSION }}"
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "out/LPoS*.zip,out/KSU*.zip"
          body: "Commit SHA: ${{ github.sha }}"